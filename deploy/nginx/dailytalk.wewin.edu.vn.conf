# /etc/nginx/sites-available/dailytalk.wewin.edu.vn
# Certificates: sudo certbot --nginx -d dailytalk.wewin.edu.vn
server {
    listen 80;
    listen [::]:80;
    server_name dailytalk.wewin.edu.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dailytalk.wewin.edu.vn;

    ssl_certificate     /etc/letsencrypt/live/dailytalk.wewin.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dailytalk.wewin.edu.vn/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:8000;
        # The app only accepts Host = dailytalk.wewin.edu.vn (APP_ORIGIN).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
